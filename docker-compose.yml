services:
  webdienthoai-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: webdienthoai-mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - webnet

  webdienthoai-app:
    build: .
    container_name: webdienthoai-app
    ports:
      - "5000:5000"
    environment:
      - DB_SERVER=webdienthoai-mssql
      - DB_USER=sa
      - DB_PASSWORD=Password123!
      - DB_NAME=WebDienThoaiDB
      - PORT=5000
    depends_on:
      - webdienthoai-mssql
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  mssql-data: